name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/retroglass-roms
          key: roms-${{ hashFiles('content/games.json') }}
      - run: npm ci
      # Validates every game's license/source/sha256 and fetches the packs.
      - run: npm run assets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
